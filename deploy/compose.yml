# RauteOS on its own server (Hetzner).
#
# One app container with the daily sweep as a thread inside it (the scheduler is
# on by default), and Caddy in front for HTTPS, which
# also serves the raute-kopf.com website straight from website/public. The
# database and the `claude` login live in /srv/rauteos/data, mounted at /data.
#
# Deployed by .github/workflows/deploy.yml on every push to main.
services:
  app:
    build:
      context: ..
      dockerfile: Dockerfile
    image: rauteos
    restart: unless-stopped
    env_file: [/srv/rauteos/.env]
    environment:
      TZ: Europe/Berlin
      NEWSPULSE_DAILY_TIMES: "08:00,13:00"
    volumes:
      - /srv/rauteos/data:/data
    # Only Caddy reaches it; never published on the host.
    expose: ["8000"]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:8000/static/app.css"]
      interval: 60s
      timeout: 10s
      start_period: 120s
      retries: 3

  caddy:
    image: caddy:2.10
    restart: unless-stopped
    ports: ["80:80", "443:443", "443:443/udp"]
    environment:
      RAUTEOS_HOSTS: ${RAUTEOS_HOSTS:-os.raute-kopf.com}
      WEBSITE_HOSTS: ${WEBSITE_HOSTS:-raute-kopf.com, www.raute-kopf.com}
    volumes:
      # The folder, not the file: git replaces a changed file with a new one,
      # and a single-file mount keeps showing the container the old copy.
      - ./caddy:/etc/caddy:ro
      - ../website/public:/srv/website:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [app]

volumes:
  caddy_data:
  caddy_config:
