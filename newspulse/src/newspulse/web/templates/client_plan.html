{# Der Redaktionsplan, in the shape DEC-5 A locks: a stack of months.

   Every style rule for this page lives in app.css rather than in a <style>
   block here, because the document beside it (client_plan_document.html) is
   self-contained and must carry its own copy — two inline blocks would drift,
   and the page-local one would win only on the page.

   The one property this page has that a prettier list would not: every hook
   carries a link to the stored row it was built from. A hook whose row has been
   deleted says so and carries no link — an evidence link that 404s would be
   worse than none, because it would look checked. #}
{% extends "base.html" %}
{% block title %}{{ translator(request)("Redaktionsplan") }} · {{ client.name }} · RauteOS{% endblock %}

{% block pagetitle %}{% include "partials/client_title.html" %}{% endblock %}

{% block content %}
{% set t = translator(request) %}
{% set active = 'plan' %}
{% include '_client_tabs.html' %}

{% include 'partials/plan_body.html' %}
{% endblock %}
