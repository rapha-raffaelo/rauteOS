# Validate the application on pushes to main and pull requests.
# Deployment is configured separately.
name: Suite

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  # One run per ref. A push that lands while the previous one is still running
  # makes the older answer worthless, and two runs racing on the same ref only
  # cost minutes.
  group: suite-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: newspulse
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.3'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build and test React
        working-directory: frontend
        run: |
          npm ci
          npm test
          npm run build
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen
      - name: Test suite
        run: uv run pytest -q
      - name: Registry hygiene
        # Cheap, and catches a duplicated or malformed feed entry before it
        # reaches the host. Reachability is deliberately not checked: the suite
        # must not depend on sixty external sites being up, which is how a
        # green suite becomes a coin toss.
        run: uv run pytest -q tests/test_feeds.py tests/test_market.py
