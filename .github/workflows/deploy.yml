name: Deploy RauteOS

# Every push to main goes live, as it did on Railway. The server builds the
# image itself, so nothing is pushed to a registry.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Build and restart on the server
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          HOST: ${{ secrets.DEPLOY_HOST }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh root@"$HOST" "set -e
            cd /srv/rauteos/repo
            git fetch --quiet origin main && git reset --hard --quiet ${{ github.sha }}
            cd deploy && docker compose up -d --build --remove-orphans
            # The Caddyfile is a bind mount, so a change to it restarts nothing.
            docker compose exec -T caddy caddy reload --config /etc/caddy/Caddyfile
            docker image prune -f >/dev/null
            for i in \$(seq 1 30); do
              docker compose exec -T app curl -fsS -o /dev/null http://localhost:8000/static/app.css && exit 0
              sleep 10
            done
            docker compose logs --tail 80 app; echo 'RauteOS did not come back within 5 minutes'; exit 1"
